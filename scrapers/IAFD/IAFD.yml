# yaml-language-server: $schema=../../validator/scraper.schema.json
#
# Lines starting with "#" are read by the build to fill the source index. Stash
# ignores them; a scraper config has no version/description field of its own and
# rejects unknown keys, so they cannot live in the config proper.
# version: 1
# description: Performer/scene/movie scraper for iafd.com. Originally from CommunityScrapers; kept and maintained here after it stopped being updated upstream. Needs py_common installed separately - see this scraper's README.
name: _IAFD
# requires: py_common

performerByName:
  action: script
  script:
    - python
    - IAFD.py
    - performer-by-name
performerByURL:
  - url:
      - iafd.com/person.rme/id=
      - iafd.com/person.rme/perfid=
    action: script
    script:
      - python
      - IAFD.py
      - performer-by-url
sceneByURL:
  - url:
      - iafd.com/title.rme/id=
      - iafd.com/title.rme/title=
    action: script
    script:
      - python
      - IAFD.py
      - scene-by-url
groupByURL:
  - url:
      - iafd.com/title.rme/id=
      - iafd.com/title.rme/title=
    action: script
    script:
      - python
      - IAFD.py
      - movie-by-url
