# Lines starting with "#" are read by the build to fill the source index.
# Stash ignores them; a scraper config has no version/description field of its own and
# rejects unknown keys, so they cannot live in the config proper.
# version: 1
# description: A placeholder entry point, kept out of the way of the real one. Fast Performer Discovery is started from the ⚡ button on a performer's page/card/list, not from here - see the FastDiscovery plugin's README for why "Scrape with..." cannot be it.

name: _MyFastPerformerScrapper

# The leading underscore is deliberate: scraper lists in Stash's UI sort by name, so
# this sits at the top, and its name cannot be mistaken for the scene-side
# "FastDiscovery" scraper (scrapers/FastDiscovery/), which is a different mechanism
# entirely.
#
# Why this is a `performerByName` scraper, and why it is not the real entry point:
#
# `scrapeSinglePerformer`, on the `scraper_id` branch, only ever forwards a `query`
# (a name search) or a `performer_input` (a client-built ScrapedPerformerInput
# fragment - which has no id field) to a script - never a `performer_id`
# (`internal/api/resolver_query_scraper.go`, `ScrapeSinglePerformerInput`, checked
# against the v0.31.1 source). So there is no reliable performer id to be had this
# way, and identifying the performer by name alone - "the first performer Stash
# finds with this name" - is exactly the unreliable shortcut this plugin refuses to
# take.
#
# Worse, unlike a scene's `sceneByFragment` shim, Stash's own frontend
# (`PerformerEditPanel.tsx`) only ever lists `NAME`-capable scrapers under
# "Scrape with...", and clicking *any* entry there - a stash-box or a scraper -
# unconditionally opens the query/pick dialog first. There is no way for a plugin
# to intercept that click and skip straight to a background job the way a scene's
# FRAGMENT scraper can; a FRAGMENT-only performer scraper would not appear in that
# menu at all.
#
# So this scraper does the only honest thing available to it: it answers every
# search with nothing, and says why in the log, rather than risk merging a name
# search's first hit into the wrong performer or opening a dialog FastDiscovery is
# built to avoid. The real trigger - queue Fast Performer Discovery, no dialog, a
# toast on success - is the ⚡ Fast Discovery button the FastDiscovery plugin adds
# to a performer's details panel, card and list, which reads the performer's real
# id straight from Stash's own React props (the same mechanism PerformerOrganized
# already relies on), never from a name.
performerByName:
  action: script
  script:
    - python
    - _MyFastPerformerScrapper.py
