# Lines starting with "#" are read by the build to fill the source index.
# Stash ignores them; a scraper config has no version/description field of its
# own and rejects unknown keys, so they cannot live in the config proper.
# version: 3
# description: Probes every non-URL scene source and returns one merged result. Configured by the ScrapeAllSettings plugin.

name: ScrapeAll

# sceneByFragment is what puts a scraper in two places at once:
#   * the scene edit panel, under "Scrape with..."
#   * Settings -> Tasks -> Identify, as a selectable source
# Both call this same entry point with the scene fragment on stdin.
sceneByFragment:
  action: script
  script:
    - python
    - ScrapeAll.py
    - scene-fragment
